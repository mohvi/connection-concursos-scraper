name: Scrape UFSA concursos
run-name: Scrape UFSA concursos

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes, no emails)'
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # detail-page fetches are paced 10s apart (robots.txt Crawl-delay), plus room for a few 15-min email rate-limit waits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: node run.js ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
